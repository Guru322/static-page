<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat Streaming</title>
    <style>
        body { background: #121212; color: white; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .chat-container { padding: 20px; max-width: 800px; margin: auto; }
        .message { padding: 10px; margin: 10px 0; border-radius: 10px; }
        .user-message { background: #5d99c6; text-align: right; }
        .bot-message { background: #2d2d2d; text-align: left; }
        .input-container { display: flex; padding: 10px; background: #1e1e1e; position: fixed; bottom: 0; width: 100%; max-width: 800px; }
        .input-field { flex: 1; padding: 10px; border: none; border-radius: 5px; }
        .send-button { margin-left: 10px; padding: 10px 20px; background: #90caf9; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="messages"></div>
    </div>
    <div class="input-container">
        <input type="text" id="userInput" class="input-field" placeholder="Type your message here...">
        <button id="sendButton" class="send-button">Send</button>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function addMessage(text, isUser, streaming = false) {
            const msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
            msg.innerHTML = text;
            if (streaming) msg.id = 'botStreamMessage';
            messagesContainer.appendChild(msg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            addMessage('', false, true);

            try {
                const response = await fetch('https://ollama.gurucharan.me/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: "hf.co/Guru322/Gurus-text-model:latest", prompt: `### Instruction:
${message}
### Response:`, stream: true })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let botText = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(line => line.trim());
                    for (const line of lines) {
                        try {
                            const json = JSON.parse(line);
                            if (json.response) {
                                botText += json.response;
                                document.getElementById('botStreamMessage').innerHTML = botText;
                            }
                        } catch (e) {}
                    }
                }
            } catch (e) {
                document.getElementById('botStreamMessage').innerHTML = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
